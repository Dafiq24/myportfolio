<form method="post" action="{% url 'main:toggle_certification_star' certification.id %}" class="star-form">
    {% csrf_token %}
    <button
        type="submit"
        class="certificate-star-action{% if user in certification.starred_by.all %} is-starred{% endif %}"
        title="{% if certification.starred_by.exists %}Starred by {{ certification.starred_by.all|join:', ' }}{% else %}Be the first to star this certification{% endif %}"
    >
        <span aria-hidden="true">&#9733;</span>
        {% if user in certification.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count" aria-label="{{ certification.starred_by.count }} stars">{{ certification.starred_by.count }}</span>
    </button>
</form>
